[pytest]
# Automated tests live under tests/, split into unit and integration:
#   tests/unit         no external services; in-memory or pure functions
#   tests/integration  FastAPI routes driven with TestClient + mocks
#
# Run from the backend/ directory:
#   python -m pytest
# or from the repository root:
#   python -m pytest backend
testpaths = tests

# Only collect genuine automated tests. The manual integration scripts in
# scripts/ are named manual_*.py and are never collected.
python_files = test_*.py

# Make the `app` package importable without installing the project,
# so tests can `from app... import ...` regardless of the working directory.
pythonpath = .

# Keep the short summary of skip/fail reasons in the output.
addopts = -ra

# Markers reserved for live checks that require external services
# (Postgres, Pinecone, Neo4j, and Gemini). These are not applied
# to any test: the automated suite never contacts a live service. The
# marker exists so a live check added later stays documented.
markers =
    integration: test requires live external services
