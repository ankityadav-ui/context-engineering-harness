# Alembic configuration for the Context Engineering Harness backend.
#
# The database URL is NEVER stored here. alembic/env.py reads it from
# the application's existing environment configuration (DATABASE_URL,
# loaded from the repository-root .env via app.context_engine.database).
#
# Apply migrations from the backend/ directory:
#   python -m alembic upgrade head
# Inspect the pending changes without applying them:
#   python -m alembic upgrade head --sql

[alembic]
script_location = alembic
prepend_sys_path = .
# Template used to name new revision files
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
